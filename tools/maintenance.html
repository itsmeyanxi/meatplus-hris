<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Under Maintenance — ALL COMPANY HRIS</title>
  <!-- Auto-reload every 10s so users land back in the app as soon as it's up. -->
  <meta http-equiv="refresh" content="10">
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      background: radial-gradient(1200px 600px at 50% -10%, #1e293b 0%, #0f172a 60%);
      color: #e2e8f0;
      display: flex; align-items: center; justify-content: center;
      padding: 24px; text-align: center;
    }
    .card {
      max-width: 460px; width: 100%;
      background: rgba(30, 41, 59, 0.6);
      border: 1px solid rgba(148, 163, 184, 0.15);
      border-radius: 20px;
      padding: 44px 36px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.35);
      backdrop-filter: blur(8px);
    }
    .brand { font-size: 13px; letter-spacing: 0.14em; text-transform: uppercase; color: #94a3b8; margin-bottom: 28px; font-weight: 600; }
    .spinner {
      width: 46px; height: 46px; margin: 0 auto 26px;
      border: 3px solid rgba(148,163,184,0.25);
      border-top-color: #60a5fa;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .spinner { animation-duration: 3s; } }
    h1 { font-size: 22px; margin: 0 0 10px; color: #f1f5f9; font-weight: 700; }
    p { font-size: 14.5px; line-height: 1.6; color: #cbd5e1; margin: 0 0 6px; }
    .muted { font-size: 12.5px; color: #94a3b8; margin-top: 22px; }
    .dot { display:inline-block; width:7px; height:7px; border-radius:50%; background:#fbbf24; margin-right:6px; vertical-align: middle; animation: pulse 1.4s ease-in-out infinite; }
    @keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:0.35;} }
  </style>
</head>
<body>
  <div class="card">
    <div class="brand">ALL COMPANY HRIS</div>
    <div class="spinner" aria-hidden="true"></div>
    <h1>We&rsquo;ll be right back</h1>
    <p>The system is being updated with the latest changes.</p>
    <p>This usually takes under a minute.</p>
    <p class="muted"><span class="dot"></span>This page refreshes automatically — no need to do anything.</p>
  </div>
</body>
</html>
